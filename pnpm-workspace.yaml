allowBuilds:
  '@sentry/node-cpu-profiler': true
  "@tailwindcss/oxide": true
  esbuild: true

minimumReleaseAgeExclude:
  - esbuild@0.25.12
  - vite@6.4.2 || 6.4.3
  - drizzle-orm@0.45.2
  - vitest@3.2.6

overrides:
  drizzle-orm@<0.45.2: ^0.45.2
  # 0.24.3 was unpublished from npm; pin yanked 0.24.x requests to direct-dep 0.25.12
  esbuild@<=0.24.3: 0.25.12
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  "tailwindcss>nanoid": "3.3.7"
  vite@<=6.4.1: ^6.4.2
  vite@<=6.4.2: ^6.4.3
  vitest@<3.2.6: ^3.2.6
